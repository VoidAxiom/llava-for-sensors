<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="placeholder-title">
  <title id="placeholder-title">Headline figure — placeholder until Phase 1 ablation completes</title>
  <style>
    .bg     { fill: #fafaf7; }
    .axis   { stroke: #c9c5bd; stroke-width: 1.2; fill: none; }
    .grid   { stroke: #e4e2dc; stroke-width: 1; stroke-dasharray: 3 4; }
    .label  { font: 11px "JetBrains Mono", "SF Mono", Menlo, monospace; fill: #5b594f; }
    .tick   { font: 10px "JetBrains Mono", "SF Mono", Menlo, monospace; fill: #8a877c; }
    .title  { font: 13px -apple-system, "Segoe UI", Inter, sans-serif; fill: #1a1a17; font-weight: 600; }
    .sub    { font: 11px -apple-system, "Segoe UI", Inter, sans-serif; fill: #5b594f; }
    .bar-1  { fill: #c9c5bd; }
    .bar-2  { fill: #d4b69d; }
    .bar-3  { fill: #b34700; }
    .barlbl { font: 11px "JetBrains Mono", "SF Mono", Menlo, monospace; fill: #1a1a17; }
    .pending { font: 11px "JetBrains Mono", "SF Mono", Menlo, monospace; fill: #b34700; font-weight: 600; }
    .errbar { stroke: #5b594f; stroke-width: 1.4; }
  </style>

  <rect class="bg" width="480" height="320" />

  <!-- title -->
  <text class="title" x="40" y="32">Headline ablation · toy dataset</text>
  <text class="sub"   x="40" y="50">macro-F1 across 3 modality conditions (5 seeds, percentile bootstrap CI)</text>

  <!-- grid -->
  <line class="grid" x1="80" y1="100" x2="450" y2="100" />
  <line class="grid" x1="80" y1="140" x2="450" y2="140" />
  <line class="grid" x1="80" y1="180" x2="450" y2="180" />
  <line class="grid" x1="80" y1="220" x2="450" y2="220" />

  <!-- y axis ticks -->
  <text class="tick" x="55" y="262" text-anchor="end">0.00</text>
  <text class="tick" x="55" y="222" text-anchor="end">0.25</text>
  <text class="tick" x="55" y="182" text-anchor="end">0.50</text>
  <text class="tick" x="55" y="142" text-anchor="end">0.75</text>
  <text class="tick" x="55" y="102" text-anchor="end">1.00</text>

  <!-- axes -->
  <line class="axis" x1="80"  y1="60"  x2="80"  y2="260" />
  <line class="axis" x1="80"  y1="260" x2="450" y2="260" />

  <!-- placeholder bars (illustrative shape only) -->
  <!-- sensors-only -->
  <rect class="bar-1" x="120" y="195" width="60" height="65" rx="2" />
  <line class="errbar" x1="150" y1="185" x2="150" y2="205" />
  <line class="errbar" x1="144" y1="185" x2="156" y2="185" />
  <line class="errbar" x1="144" y1="205" x2="156" y2="205" />
  <text class="label"  x="150" y="278" text-anchor="middle">sensors-only</text>
  <text class="barlbl" x="150" y="180" text-anchor="middle">≈0.50</text>

  <!-- vision+text -->
  <rect class="bar-2" x="210" y="190" width="60" height="70" rx="2" />
  <line class="errbar" x1="240" y1="180" x2="240" y2="200" />
  <line class="errbar" x1="234" y1="180" x2="246" y2="180" />
  <line class="errbar" x1="234" y1="200" x2="246" y2="200" />
  <text class="label"  x="240" y="278" text-anchor="middle">vision+text</text>
  <text class="barlbl" x="240" y="175" text-anchor="middle">≈0.55</text>

  <!-- all-three -->
  <rect class="bar-3" x="300" y="105" width="60" height="155" rx="2" />
  <line class="errbar" x1="330" y1="95"  x2="330" y2="115" />
  <line class="errbar" x1="324" y1="95"  x2="336" y2="95"  />
  <line class="errbar" x1="324" y1="115" x2="336" y2="115" />
  <text class="label"  x="330" y="278" text-anchor="middle">all-three</text>
  <text class="barlbl" x="330" y="90"  text-anchor="middle">≈0.95</text>

  <!-- pending watermark -->
  <text class="pending" x="240" y="305" text-anchor="middle">
    placeholder · re-runs when eval/headline.py writes docs/figures/headline.svg
  </text>
</svg>
