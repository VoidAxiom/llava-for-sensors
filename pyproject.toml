[project]
name = "llava-for-sensors"
version = "0.0.1"
description = "Multimodal fault-prediction model fusing time-series sensor data with vision and language on a frozen Qwen2-VL-2B."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "transformers",
    "peft",
    "accelerate",
    "numpy",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas",
    "matplotlib",
    "gradio>=4.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
python-preference = "managed"

[tool.ruff]
target-version = "py311"
line-length = 100
